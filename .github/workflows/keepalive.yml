# Keep-alive ping for the production database.
#
# Supabase's free tier pauses a project after 7 days without database
# activity. This hits /api/v1/health/db once a day, which runs `SELECT 1`
# through the Railway backend — real query activity, so the project stays up.
#
# If the database is unreachable the endpoint returns 503, curl --fail makes
# this job fail, and GitHub emails the repo owner: an early warning before
# anyone opens the demo.
#
# Gotcha: GitHub disables scheduled workflows in a public repo after 60 days
# with no commits. If that happens, re-enable it from the Actions tab.

name: Database keep-alive

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC (off the hour: top-of-hour cron runs get delayed)
  workflow_dispatch: # allow a manual run from the Actions tab

permissions: {} # needs no repo access

jobs:
  ping:
    runs-on: ubuntu-latest
    # curl worst case: 4 attempts x 60s + 3 x 20s delay = 300s, so leave headroom.
    timeout-minutes: 10
    steps:
      - name: Ping database health endpoint
        # --retry covers Railway cold starts (~30s) and a briefly waking DB.
        run: |
          curl --fail --silent --show-error \
            --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors \
            https://tidal-production.up.railway.app/api/v1/health/db
