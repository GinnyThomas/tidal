# Backend test suite, including the PostgreSQL-only migration tests.
#
# Most tests run on in-memory SQLite. tests/test_migrations_rls.py needs a
# real PostgreSQL (RLS and roles don't exist in SQLite) and is skipped unless
# POSTGRES_TEST_URL is set — so locally it's opt-in, but here it always runs.
# That's what catches a new table whose migration forgets to enable RLS.

name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          # The migration test refuses any database without "test" in its name.
          POSTGRES_DB: tidal_migrations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          # The service's postgres user is a superuser, so it can CREATE ROLE.
          POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/tidal_migrations_test
        run: python -m pytest tests/ -q
